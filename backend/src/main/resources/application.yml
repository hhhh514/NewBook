spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/work?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Taipei}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
