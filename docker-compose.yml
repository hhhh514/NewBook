services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["80:80"]
    depends_on: [app]
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/work?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Taipei
      DB_USERNAME: social_user
      DB_PASSWORD: social_password
      JWT_SECRET: replace-with-a-long-random-production-secret-at-least-32-bytes
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: work
      MYSQL_USER: social_user
      MYSQL_PASSWORD: social_password
      MYSQL_ROOT_PASSWORD: root_password_change_me
    volumes:
      - ./DB/01_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./DB/02_dml.sql:/docker-entrypoint-initdb.d/02_dml.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password_change_me"]
      interval: 5s
      timeout: 5s
      retries: 20
